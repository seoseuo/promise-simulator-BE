spring:
  datasource:
    # 로컬 PostgreSQL 접속 정보는 환경 변수로 주입한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/promise_simulator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # 로컬에서만 엔티티를 기준으로 테이블을 생성·갱신한다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
